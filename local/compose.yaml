# The whole local runtime: one (Greengrass) core and N self-provisioning
# clients. `podman compose -f local/compose.yaml up -d --scale client=N`
# (or `podman-compose`) is the entire path from "nothing running" to "N
# devices trying to discover the core." This file creates lab-gg-net and
# both named volumes itself — no separate imperative `podman network
# create` / `podman volume create` step is needed.
#
# Prerequisites this file assumes already exist (see README.md's Runbook):
#   - ../aws-greengrass-docker                       cloned by the user
#   - ../certs/lab-gg-core-01, ../certs/claim        signed certs + keys
#   - ../greengrass.env                              static, checked in
#   - ../config/config.yaml, ../client.env           generated by
#     scripts/gen-core-config.sh from infra/20-fleet's Terraform outputs
#
# IMPORTANT — identity vs. container lifecycle for `client`:
#
#   `client` replicas get NO `hostname:` on purpose. entrypoint.sh derives
#   SERIAL from `hostname` when the SERIAL env var is unset, and Podman
#   gives every replica with no explicit hostname its own distinct,
#   container-ID-derived one — that's what makes SERIAL unique per replica
#   for compose-driven scaling, with no per-replica config needed.
#
#   `podman restart <replica>` (or `podman start` after a stop) keeps the
#   same container, so it keeps the same hostname, so it keeps the same
#   SERIAL and the same stored identity under /data/<SERIAL> on the shared
#   volume. Restart is what claim 2 (identity persistence) relies on:
#   restart != recreate.
#
#   `podman compose up --scale client=N` after editing this file, or any
#   `--force-recreate`, DESTROYS and RECREATES existing replica containers.
#   A recreated container gets a brand-new random hostname, so it looks
#   like a device that has never provisioned before: it registers a SECOND
#   Thing under a new serial instead of reusing its old one, and the old
#   Thing/certificate is silently orphaned in the registry (cleanup-
#   clients.sh only ever acts on whatever lab-gg-clients currently
#   contains). Scaling UP is fine — new replicas correctly get new serials.
#   Recreating EXISTING replicas is what to avoid: prefer `podman restart`
#   or `podman start` for replicas that have already provisioned.

services:
  core:
    build:
      context: ../aws-greengrass-docker
      args:
        GREENGRASS_RELEASE_VERSION: "2.18.3"
    image: localhost/aws-iot-greengrass:2.18.3
    container_name: lab-gg-core-01
    hostname: lab-gg-core-01
    init: true
    stop_grace_period: 30s
    env_file:
      - ../greengrass.env
    volumes:
      - ../config:/tmp/config:ro
      - ../certs/lab-gg-core-01:/tmp/certs:ro
      - lab-gg-core-01-root:/greengrass/v2
    networks:
      lab-gg-net:
        ipv4_address: 10.89.40.10
    # No `ports:` — Moquette's 8883 must never be reachable from the host,
    # only from lab-gg-net.

  client:
    build:
      # Build context is client-image/ ONLY. Never point this at the repo
      # root: ../certs holds the core key and the shared claim key, and
      # this image must never be able to see either, even at build time.
      context: ../client-image
      dockerfile: Containerfile
    image: localhost/lab-gg-client:1.31.0
    # No `container_name:` (replicas can't share one) and no `hostname:`
    # (see the note above — each replica needs its own auto-generated one).
    env_file:
      - ../client.env # IOT_DATA_ENDPOINT, generated by scripts/gen-core-config.sh
    environment:
      AWS_REGION: "ap-northeast-1"
    volumes:
      - ../certs/claim:/claim:ro
      - lab-gg-clients-data:/data
    networks:
      - lab-gg-net
    # No `ports:` — a client never accepts inbound connections; it only
    # dials out to AWS IoT Core (HTTPS discovery, provisioning MQTT) and to
    # the core over the local broker (mTLS).

networks:
  lab-gg-net:
    ipam:
      config:
        - subnet: 10.89.40.0/24

volumes:
  lab-gg-core-01-root: {}
  lab-gg-clients-data: {}
